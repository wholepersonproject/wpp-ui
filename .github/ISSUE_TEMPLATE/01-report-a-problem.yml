name: Report a website problem
description: "Tell us when something is broken, confusing, or preventing you from completing a task."
title: "[Problem]: "
type: "Bug"
labels: ["🔍 Needs triage"]

body:
  - type: input
    id: page-url
    attributes:
      label: Which page has the problem?
      description: Paste the full web address. If the problem affects several pages, share the best example.
      placeholder: "https://wholepersonphysiome.org/example-page"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you were trying to do and what went wrong. Include any error message you saw.
      placeholder: |
        I was trying to download a file, but the download button did not respond.
    validations:
      required: true

  - type: input
    id: browser-and-device
    attributes:
      label: What browser and device were you using?
      description: Share the browser name and the type of computer, phone, or tablet you were using.
      placeholder: "Example: Chrome on a Windows laptop, or Safari on an iPhone"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Can you show us what you saw?
      description: Add a screenshot or recording that shows the problem.
      placeholder: |
        Optional: Drag and drop a screenshot or recording here.
    validations:
      required: false
