<ang-header-shell
  [logoUrl]="headerLogo()"
  [hasLocalNavigation]="true"
  [localNavigationExpanded]="navigation.leftMenuOpen()"
  [navigationItems]="navigationItems().filter((item) => item.id !== 'home')"
  (localNavigationToggle)="navigation.localNavigationToggle()"
  (appsMenuToggle)="navigation.appsMenuToggle()"
/>
<ang-navigation-container
  [navigationItems]="navigationItems()"
  [navRight]="appMenuItems()"
  [socialMediaIds]="socialMediaIds()"
  #navigation
>
  <main class="page-content">
    <router-outlet />
  </main>
  <ang-footer
    orgName="Whole Person Physiome"
    [logoUrl]="footerLogo()"
    [socials]="socialMediaIds()"
    (openPrivacyPolicy)="openPrivacyPolicy()"
    (openPrivacyPreferences)="openPrivacyPreferences()"
  />
</ang-navigation-container>

@if (!preferencesSet()) {
  <ang-cookie-banner
    privacyPolicy="/privacy-policy"
    (allowAll)="allowAllCookies()"
    (allowNecessary)="allowNecessaryCookies()"
    (customize)="openPrivacyPreferences()"
  />
}
