<ang-header-shell
  logoSrc="wpp-header-dark.svg"
  localNavigation
  [localNavigationExpanded]="navigation.leftMenuOpen()"
  [localNavigationControls]="navigation.leftMenuId"
  [appsMenuExpanded]="navigation.rightMenuOpen()"
  [appsMenuControls]="navigation.rightMenuId"
  [navigationItems]="navigationItems().filter((item) => item.id !== 'home')"
  (localNavigationClick)="navigation.toggleLocalNavigation(); kgExplorerFilters.closeOverlay()"
  (appsMenuClick)="navigation.toggleAppsMenu(); kgExplorerFilters.closeOverlay()"
>
  @if (kgExplorerFilters.available()) {
    <button
      matIconButton
      angHeaderShellAction
      type="button"
      [matTooltip]="kgExplorerFilters.open() ? 'Hide filters' : 'Show filters'"
      [attr.aria-label]="kgExplorerFilters.open() ? 'Hide filters' : 'Show filters'"
      [attr.aria-pressed]="kgExplorerFilters.open()"
      (click)="toggleKgExplorerFilters()"
    >
      <mat-icon fontIcon="tune" />
    </button>
  }
</ang-header-shell>
<ang-navigation-container
  [leftNavigationItems]="localNavigationItems()"
  [rightNavigationItems]="appMenuItems()"
  [socials]="socialMediaIds()"
  #navigation
>
  <main class="page-content">
    <router-outlet />
  </main>
  @if (!pageFooter.inPage()) {
    <ng-container [ngTemplateOutlet]="footer" />
  }
</ang-navigation-container>

<ng-template #footer>
  <ang-footer
    organization="Whole Person Physiome"
    logoSrc="wpp-footer.svg"
    [socials]="socialMediaIds()"
    (privacyPolicyClick)="openPrivacyPolicy()"
    (privacyPreferencesClick)="openPrivacyPreferences()"
  />
</ng-template>

@if (!preferencesSet()) {
  <ang-cookie-banner
    (allowAll)="allowAllCookies()"
    (allowNecessary)="allowNecessaryCookies()"
    (customize)="openPrivacyPreferences()"
  >
    <a angCookieBannerPrivacyPolicy angTextLink angAnyLink="/privacy-policy" target="_blank">Privacy policy</a>
  </ang-cookie-banner>
}
