<div
  class="landing-page"
  [style.background-image]="`url(${data().splash.backgroundImageUrl})`"
>
  <div class="landing-page-content-container">
    <div class="landing-page-content">
      <h1 class="header">{{ data().splash.title }}</h1>
      <div class="description">{{ data().splash.description }}</div>
      <div class="funder">{{ data().splash.funder }}</div>
    </div>
  </div>
</div>

<wpp-news-and-events [content]="data().newsAndEvents" />
