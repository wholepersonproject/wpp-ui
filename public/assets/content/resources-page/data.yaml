headerContent:
  title: Resources
  subtitle: |
    Browse videos, download Whole Person Physiome assets, and share feedback about the website.
  breadcrumbs:
    - name: Home
      command: /
    - name: Resources
content:
  - type: section
    tagline: Videos
    anchor: videos
    level: 2
    content:
      - type: markdown
        data: |
          Watch Whole Person Physiome research in action.

  - type: section
    tagline: Whole Person Physiome (WPP) Tables
    anchor: wpp-tables
    level: 3
    underline: false
    content:
      - type: markdown
        data: |
          Jacob Scherba (University of Pennsylvania) presents a brief introduction to the Whole
          Person Physiome (WPP) tables on December 3, 2025.

      - type: youtube
        videoId: HLs_Tmjiz8U

  - type: section
    tagline: Whole Person Physiome Knowledge Graph
    anchor: wpp-knowledge-graph
    level: 3
    underline: false
    content:
      - type: markdown
        data: |
          Bruce W. Herr II (Indiana University) presents the working knowledge graph developed for the Whole Person Physiome, which models the function of 14 organ systems.

      - type: youtube
        videoId: xIYQwJtK3YU

  - type: section
    tagline: Whole Person Physiome Initial Visualization
    anchor: wpp-initial-visualization
    level: 3
    underline: false
    content:
      - type: markdown
        data: |
          Katy Börner (Indiana University) introduces data visualizations developed for the Whole Person Physiome that provide objective, reproducible depictions of WPP data to support researchers' actionable insights.

      - type: youtube
        videoId: kNphiKTBIPU

  - type: section
    tagline: Standards for Multiscale Cellular Modeling
    anchor: standards-for-multiscale-cellular-modeling
    level: 3
    underline: false
    content:
      - type: markdown
        data: |
          Katy Börner (Indiana University) introduces Eran Agmon (UConn Health), who presents his
          research on standards for multiscale cellular modeling at Human Reference Atlas Working
          Group #68 on November 5, 2025.

          Learn more at [Vivarium Lab](https://vivariumlab.com).
      - type: youtube
        videoId: hmCrPPL6kyQ

  - type: section
    tagline: CompuCell3D
    anchor: compucell3d
    level: 3
    underline: false
    content:
      - type: markdown
        data: |
          James Glazier (Indiana University) presents CompuCell3D, an open-source software
          environment for building agent-based models of multicellular biology, at Human Reference
          Atlas Working Group #65 on August 6, 2025.

          Learn more at [CompuCell3D](https://compucell3d.org).

      - type: youtube
        videoId: WYKv-yB_j2M

  - type: section
    tagline: CIFAR MacMillan Multiscale Human
    anchor: cifar-macmillan-multiscale-human
    level: 3
    underline: false
    content:
      - type: markdown
        data: |
          Muzlifah Haniffa (Sanger Institute, UK), Hirokai Kitano (Sony, Japan), and Katy Börner (Indiana University) introduce the [CIFAR MacMillan Multiscale Human](https://cifar.ca/research-programs/cifar-macmillan-multiscale-human) project that aims to (1) catalyze medically relevant discoveries about how the human body works, from development to disease and aging; (2) work with large biobank consortia to explore ways of incorporating global health and genetic data into multiscale maps and models of the human body, and (3) bring together biologists with imaging, computational and digital cartography specialists to spur the development of new tools, both in hardware and software.

      - type: youtube
        videoId: -F6i5KOVGx8

  - type: section
    tagline: |
      Understanding Exercise and MoTrPAC: Informational Video
    anchor: motrpac
    level: 3
    underline: false
    content:
      - type: markdown
        data: |
          Watch Astronaut Dr. Peggy Whitson explain the importance of understanding exercise and
          The NIH Common Fund’s Molecular Transducers of Physical Activity in Humans Consortium
          (MoTrPAC). The MoTrPAC program is a trans-NIH effort managed by the NIH Common Fund in
          the Office of the Director and supported by several Institutes & Centers including,
          NIAMS, NIA and NIDDK.

          Learn more about the [MoTrPAC program and recruitment](https://commonfund.nih.gov/MolecularTransducers/PublicHealthRelevance).

      - type: youtube
        videoId: STdfWChns5w

  - type: section
    tagline: MoTrPAC Data Hub Tutorial
    anchor: motrpac-tutorial
    level: 3
    underline: false
    content:
      - type: markdown
        data: |
          Learn about how to navigate the MoTrPAC Data Hub and explore the multi-omics multi-tissue
          exercise data.

      - type: youtube
        videoId: 3zHnzUMo_vw

  - type: section
    tagline: Visual assets
    anchor: visual-assets
    level: 2
    content:
      - type: markdown
        data: |
          Download a ZIP file containing Whole Person Physiome logos to support your presentations, publications, and other communications about the effort. File formats included are SVG, PNG, and PDF.

      - type: button
        text: Download logos
        icon: download
        route: assets/content/resources-page/wpp-logos.zip

      - type: image
        src: assets\content\resources-page\wpp-visuals.png
        alt: Whole Person Physiome brandmark and logo.

  - type: section
    tagline: Website feedback
    anchor: website-feedback
    level: 2
    content:
      - type: markdown
        data: |
          Please use the forms below to share feedback about the website. A GitHub account is required to submit feedback.

      - type: card-grid
        items:
          - id: report-problem
            title: Report a problem
            description: Tell us when something is broken, confusing, or preventing you from completing a task.
            actions:
              - text: Report issue on GitHub
                url: https://github.com/wholepersonproject/wpp-ui/issues/new?template=01-report-a-problem.yml
                icon: bug_report

          - id: update-existing-page
            title: Update an existing page
            description: Request a change to text, links, images, or files on a page that already exists.
            actions:
              - text: Request update on GitHub
                url: https://github.com/wholepersonproject/wpp-ui/issues/new?template=02-update-existing-page.yml
                icon: edit_document

          - id: request-new-page
            title: Request a new page
            description: Request a website page that does not exist yet.
            actions:
              - text: Request page on GitHub
                url: https://github.com/wholepersonproject/wpp-ui/issues/new?template=03-request-new-page.yml
                icon: add_circle
